name: Unzip Folder Automatically
on:
  push:
    paths:
      - '*.zip' # Runs whenever a .zip file is uploaded

jobs:
  unzip-file:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip the file
        run: |
          unzip -o project.zip -d .
          rm project.zip

      - name: Commit and Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add .
          git commit -m "Automated unzip from GitHub Actions" || exit 0
          git push
